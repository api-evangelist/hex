aid: hex
name: Hex
description: >-
  Hex is an AI-powered analytics platform that combines agentic notebooks,
  interactive data apps, and conversational self-serve analytics so teams can go
  from ad-hoc exploration to published, governed data apps. The Hex External API
  (bearer-token authenticated, base https://app.hex.tech/api/v1) lets you
  programmatically run and schedule projects, manage projects, collections,
  groups, cells, and data connections, ingest semantic models, drive AI agent
  Threads (create, continue, read messages), export projects, and administer
  workspace users. Hex also ships a first-party CLI, a hosted remote MCP server,
  Airflow and Dagster integrations, and published Claude Agent Skills. Surfaced
  as an a16z portfolio company and enriched with its real public developer
  surface.
