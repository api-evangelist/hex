openapi: 3.2.0
info:
  title: Hex Groups API
  version: 1.0.0
  description: API specification for the Hex External API
  license:
    name: UNLICENSED
  contact: {}
servers:
- url: https://app.hex.tech/api
security:
- bearerAuth: []
tags:
- name: Groups
paths:
  /v1/groups/{groupId}:
    get:
      operationId: GetGroup
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupApiResource'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsoaErrorResponsePayload'
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsoaErrorResponsePayload'
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsoaErrorResponsePayload'
      parameters:
      - in: path
        name: groupId
        required: true
        schema:
          $ref: '#/components/schemas/GroupId'
      tags:
      - Groups
      summary: Get group
      x-summary-source: derived
    delete:
      operationId: DeleteGroup
      responses:
        '204':
          description: ''
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsoaErrorResponsePayload'
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsoaErrorResponsePayload'
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsoaErrorResponsePayload'
      parameters:
      - in: path
        name: groupId
        required: true
        schema:
          $ref: '#/components/schemas/GroupId'
      tags:
      - Groups
      summary: Delete group
      x-summary-source: derived
    patch:
      operationId: EditGroup
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupApiResource'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsoaErrorResponsePayload'
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsoaErrorResponsePayload'
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsoaErrorResponsePayload'
      parameters:
      - in: path
        name: groupId
        required: true
        schema:
          $ref: '#/components/schemas/GroupId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                members:
                  properties:
                    remove:
                      $ref: '#/components/schemas/GroupMembers'
                    add:
                      $ref: '#/components/schemas/GroupMembers'
                  type: object
                name:
                  $ref: '#/components/schemas/Name'
              type: object
      tags:
      - Groups
      summary: Edit group
      x-summary-source: derived
  /v1/groups:
    get:
      operationId: ListGroups
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListGroupsResponse'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsoaErrorResponsePayload'
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsoaErrorResponsePayload'
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsoaErrorResponsePayload'
      parameters:
      - in: query
        name: after
        required: false
        schema:
          default: null
      - in: query
        name: before
        required: false
        schema:
          default: null
      - in: query
        name: limit
        required: false
        schema:
          $ref: '#/components/schemas/LargerPageSize'
      - in: query
        name: sortBy
        required: false
        schema:
          $ref: '#/components/schemas/ListGroupsSortByEnum'
      - in: query
        name: sortDirection
        required: false
        schema:
          $ref: '#/components/schemas/SortDirectionEnum'
      tags:
      - Groups
      summary: List groups
      x-summary-source: derived
    post:
      operationId: CreateGroup
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateGroupResponse'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsoaErrorResponsePayload'
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsoaErrorResponsePayload'
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsoaErrorResponsePayload'
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                members:
                  $ref: '#/components/schemas/GroupMembers'
                name:
                  $ref: '#/components/schemas/Name'
              required:
              - name
              type: object
      tags:
      - Groups
      summary: Create group
      x-summary-source: derived
components:
  schemas:
    EnumValues_typeofListGroupsSortByEnum_:
      type: string
      enum:
      - CREATED_AT
      - NAME
    CreateGroupResponse:
      properties:
        id:
          $ref: '#/components/schemas/GroupId'
        name:
          $ref: '#/components/schemas/Name'
        members:
          $ref: '#/components/schemas/GroupMembers'
      required:
      - id
      - name
      - members
      type: object
      additionalProperties: false
    GroupApiResource:
      properties:
        id:
          $ref: '#/components/schemas/GroupId'
        name:
          type: string
        createdAt:
          $ref: '#/components/schemas/Timestamp'
      required:
      - id
      - name
      - createdAt
      type: object
      additionalProperties: false
    Timestamp:
      type: string
      format: timestamp
      description: An ISO 8601 timestamp with timezone like 1970-01-01T00:00:00Z.
    GroupMembers:
      properties:
        users:
          items:
            properties:
              id:
                $ref: '#/components/schemas/UserId'
            required:
            - id
            type: object
          type: array
          maxItems: 100
      type: object
      additionalProperties: false
    GroupId:
      type: string
      format: uuid
      description: Unique ID for a group. This can be found from the groups page (in Settings).
      pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
    LargerPageSize:
      type: integer
      format: int32
      default: '25'
      description: Number of results to fetch per page for paginated requests
      minimum: 1
      maximum: 500
    TsoaErrorResponsePayload:
      properties:
        details:
          type: string
        traceId:
          $ref: '#/components/schemas/TraceId'
        reason:
          type: string
      required:
      - reason
      type: object
    UserId:
      type: string
      format: uuid
      description: Unique ID for a user. This can be found from the users page (in Settings).
      pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
    ListGroupsResponse:
      properties:
        values:
          items:
            $ref: '#/components/schemas/GroupApiResource'
          type: array
        pagination:
          $ref: '#/components/schemas/PaginationApiResource'
      required:
      - values
      - pagination
      type: object
      additionalProperties: false
    TraceId:
      type: string
      description: A unique identifier for this API request. The Hex Support team may request this value when debugging an issue.
    EnumValues_typeofSortDirectionEnum_:
      type: string
      enum:
      - DESC
      - ASC
    PaginationApiResource:
      properties:
        after:
          allOf:
          - $ref: '#/components/schemas/ApiPaginationCursor'
        before:
          allOf:
          - $ref: '#/components/schemas/ApiPaginationCursor'
      required:
      - after
      - before
      type: object
      additionalProperties: false
    ApiPaginationCursor:
      type: string
      description: 'A cursor string used with `before` and `after` parameters to paginate through a list

        of items on the API.'
    ListGroupsSortByEnum:
      $ref: '#/components/schemas/EnumValues_typeofListGroupsSortByEnum_'
    SortDirectionEnum:
      $ref: '#/components/schemas/EnumValues_typeofSortDirectionEnum_'
    Name:
      type: string
      minLength: 1
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
