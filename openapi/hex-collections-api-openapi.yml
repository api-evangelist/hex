openapi: 3.2.0
info:
  title: Hex Collections API
  version: 1.0.0
  description: API specification for the Hex External API
  license:
    name: UNLICENSED
  contact: {}
servers:
- url: https://app.hex.tech/api
security:
- bearerAuth: []
tags:
- name: Collections
paths:
  /v1/collections/{collectionId}:
    get:
      operationId: GetCollection
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionApiResource'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsoaErrorResponsePayload'
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsoaErrorResponsePayload'
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsoaErrorResponsePayload'
      parameters:
      - in: path
        name: collectionId
        required: true
        schema:
          $ref: '#/components/schemas/CollectionId'
      tags:
      - Collections
      summary: Get collection
      x-summary-source: derived
    patch:
      operationId: EditCollection
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionApiResource'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsoaErrorResponsePayload'
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsoaErrorResponsePayload'
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsoaErrorResponsePayload'
      parameters:
      - in: path
        name: collectionId
        required: true
        schema:
          $ref: '#/components/schemas/CollectionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                sharing:
                  properties:
                    upsert:
                      $ref: '#/components/schemas/CollectionApiResourceSharing'
                  type: object
                description:
                  type: string
                name:
                  $ref: '#/components/schemas/Name'
              type: object
      tags:
      - Collections
      summary: Edit collection
      x-summary-source: derived
  /v1/collections:
    get:
      operationId: ListCollections
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCollectionsResponse'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsoaErrorResponsePayload'
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsoaErrorResponsePayload'
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsoaErrorResponsePayload'
      parameters:
      - in: query
        name: after
        required: false
        schema:
          default: null
      - in: query
        name: before
        required: false
        schema:
          default: null
      - in: query
        name: limit
        required: false
        schema:
          $ref: '#/components/schemas/PageSize'
      - in: query
        name: sortBy
        required: false
        schema:
          $ref: '#/components/schemas/ListCollectionsSortByEnum'
      tags:
      - Collections
      summary: List collections
      x-summary-source: derived
    post:
      operationId: CreateCollection
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionApiResource'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsoaErrorResponsePayload'
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsoaErrorResponsePayload'
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsoaErrorResponsePayload'
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                sharing:
                  $ref: '#/components/schemas/CollectionApiResourceSharing'
                description:
                  type: string
                name:
                  type: string
              required:
              - name
              type: object
      tags:
      - Collections
      summary: Create collection
      x-summary-source: derived
components:
  schemas:
    CollectionApiResource:
      properties:
        id:
          $ref: '#/components/schemas/CollectionId'
        name:
          $ref: '#/components/schemas/Name'
        description:
          type: string
        creator:
          properties:
            email:
              type: string
            id:
              $ref: '#/components/schemas/UserId'
          required:
          - email
          - id
          type: object
        sharing:
          $ref: '#/components/schemas/CollectionApiResourceSharing'
      required:
      - id
      - name
      - sharing
      type: object
      additionalProperties: false
    PageSize:
      type: integer
      format: int32
      default: '25'
      description: Number of results to fetch per page for paginated requests
      minimum: 1
      maximum: 100
    ListCollectionsResponse:
      properties:
        values:
          items:
            $ref: '#/components/schemas/CollectionApiResource'
          type: array
        pagination:
          $ref: '#/components/schemas/PaginationApiResource'
      required:
      - values
      - pagination
      type: object
      additionalProperties: false
    CollectionApiResourceSharing:
      properties:
        users:
          items:
            properties:
              access:
                $ref: '#/components/schemas/CollectionAccess'
              id:
                $ref: '#/components/schemas/UserId'
            required:
            - access
            - id
            type: object
          type: array
        groups:
          items:
            properties:
              access:
                $ref: '#/components/schemas/CollectionAccess'
              id:
                $ref: '#/components/schemas/GroupId'
            required:
            - access
            - id
            type: object
          type: array
        workspace:
          properties:
            members:
              $ref: '#/components/schemas/CollectionAccess'
          type: object
      type: object
      additionalProperties: false
    UserId:
      type: string
      format: uuid
      description: Unique ID for a user. This can be found from the users page (in Settings).
      pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
    TsoaErrorResponsePayload:
      properties:
        details:
          type: string
        traceId:
          $ref: '#/components/schemas/TraceId'
        reason:
          type: string
      required:
      - reason
      type: object
    CollectionAccess:
      $ref: '#/components/schemas/EnumValues_typeofCollectionAccess_'
    GroupId:
      type: string
      format: uuid
      description: Unique ID for a group. This can be found from the groups page (in Settings).
      pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
    TraceId:
      type: string
      description: A unique identifier for this API request. The Hex Support team may request this value when debugging an issue.
    EnumValues_typeofCollectionAccess_:
      type: string
    ApiPaginationCursor:
      type: string
      description: 'A cursor string used with `before` and `after` parameters to paginate through a list

        of items on the API.'
    CollectionId:
      type: string
      format: uuid
      description: Unique ID for a collection.
      pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
    PaginationApiResource:
      properties:
        after:
          allOf:
          - $ref: '#/components/schemas/ApiPaginationCursor'
        before:
          allOf:
          - $ref: '#/components/schemas/ApiPaginationCursor'
      required:
      - after
      - before
      type: object
      additionalProperties: false
    ListCollectionsSortByEnum:
      $ref: '#/components/schemas/EnumValues_typeofListCollectionsSortByEnum_'
    Name:
      type: string
      minLength: 1
    EnumValues_typeofListCollectionsSortByEnum_:
      type: string
      enum:
      - NAME
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
