openapi: 3.2.0
info:
  title: Hex Data Connections API
  version: 1.0.0
  description: API specification for the Hex External API
  license:
    name: UNLICENSED
  contact: {}
servers:
- url: https://app.hex.tech/api
security:
- bearerAuth: []
tags:
- name: Data Connections
paths:
  /v1/data-connections:
    post:
      operationId: CreateDataConnection
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataConnectionWithSensitiveFieldsApiResource'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsoaErrorResponsePayload'
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsoaErrorResponsePayload'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsoaErrorResponsePayload'
        '422':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsoaErrorResponsePayload'
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsoaErrorResponsePayload'
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                sharing:
                  properties:
                    workspace:
                      properties:
                        public:
                          $ref: '#/components/schemas/DataConnectionPublicSharingAccessLevelEnum'
                        guests:
                          $ref: '#/components/schemas/DataConnectionSharingAccessLevelEnum'
                        members:
                          $ref: '#/components/schemas/DataConnectionSharingAccessLevelEnum'
                      type: object
                    groups:
                      items:
                        properties:
                          access:
                            $ref: '#/components/schemas/DataConnectionSharingAccessLevelEnum'
                          group:
                            properties:
                              id:
                                $ref: '#/components/schemas/GroupId'
                            required:
                            - id
                            type: object
                        required:
                        - access
                        - group
                        type: object
                      type: array
                  type: object
                schemaRefreshAccess:
                  $ref: '#/components/schemas/DataConnectionSchemaRefreshAccess'
                schemaRefreshSchedule:
                  $ref: '#/components/schemas/SchemaRefreshScheduleApiResource'
                schemaFilters:
                  properties:
                    tables:
                      $ref: '#/components/schemas/SchemaEntityFilter'
                    schemas:
                      $ref: '#/components/schemas/SchemaEntityFilter'
                    databases:
                      $ref: '#/components/schemas/SchemaEntityFilter'
                  type: object
                sensitivity:
                  properties:
                    configured:
                      type: boolean
                      description: The stored sensitivity setting. OAuth user-scoped results may still make the connection effectively sensitive. Defaults to false.
                  required:
                  - configured
                  type: object
                allowWritebackCells:
                  type: boolean
                includeMagic:
                  type: boolean
                connectViaSsh:
                  type: boolean
                description:
                  type: string
                connectionDetails:
                  $ref: '#/components/schemas/CreateConnectionDetails'
                type:
                  $ref: '#/components/schemas/DataConnectionApiType'
                name:
                  $ref: '#/components/schemas/Name'
              required:
              - connectionDetails
              - type
              - name
              type: object
      tags:
      - Data Connections
      summary: Create data connection
      x-summary-source: derived
    get:
      operationId: ListDataConnections
      summary: ListDataConnections
      description: 'List the workspace''s data connections.


        This endpoint is subject to the following rate limits:

        - `hex-api`: Default rate limit group for the Hex API

        - Max requests per minute may vary (default: 30)

        - Max requests per hour may vary (default: 1800)'
      parameters:
      - in: query
        name: after
        schema:
          type:
          - string
          - 'null'
          default: null
      - in: query
        name: before
        schema:
          type:
          - string
          - 'null'
          default: null
      - in: query
        name: limit
        schema:
          type: number
          minimum: 1
          maximum: 100
          default: 25
      - in: query
        name: sortBy
        schema:
          type: string
          enum:
          - NAME
          - CREATED_AT
          default: NAME
      - in: query
        name: sortDirection
        schema:
          type: string
          enum:
          - ASC
          - DESC
          default: ASC
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  values:
                    type: array
                    items:
                      anyOf:
                      - $ref: '#/components/schemas/DataConnection'
                      - $ref: '#/components/schemas/DataConnectionBasic'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
                required:
                - values
                - pagination
        '400':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.BAD_REQUEST'
        '401':
          description: Authorization not provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.UNAUTHORIZED'
        '403':
          description: Insufficient access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.FORBIDDEN'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.NOT_FOUND'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.INTERNAL_SERVER_ERROR'
      tags:
      - Data Connections
  /v1/data-connections/{dataConnectionId}:
    patch:
      operationId: EditDataConnection
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataConnectionWithSensitiveFieldsApiResource'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsoaErrorResponsePayload'
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsoaErrorResponsePayload'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsoaErrorResponsePayload'
        '422':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsoaErrorResponsePayload'
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsoaErrorResponsePayload'
      parameters:
      - in: path
        name: dataConnectionId
        required: true
        schema:
          $ref: '#/components/schemas/DataConnectionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                sharing:
                  properties:
                    workspace:
                      properties:
                        public:
                          $ref: '#/components/schemas/DataConnectionPublicSharingAccessLevelEnum'
                        guests:
                          $ref: '#/components/schemas/DataConnectionSharingAccessLevelEnum'
                        members:
                          $ref: '#/components/schemas/DataConnectionSharingAccessLevelEnum'
                      type: object
                    groups:
                      properties:
                        upsert:
                          items:
                            properties:
                              access:
                                $ref: '#/components/schemas/DataConnectionSharingAccessLevelEnum'
                              group:
                                properties:
                                  id:
                                    $ref: '#/components/schemas/GroupId'
                                required:
                                - id
                                type: object
                            required:
                            - access
                            - group
                            type: object
                          type: array
                      type: object
                  type: object
                schemaRefreshAccess:
                  $ref: '#/components/schemas/DataConnectionSchemaRefreshAccess'
                schemaRefreshSchedule:
                  allOf:
                  - $ref: '#/components/schemas/SchemaRefreshScheduleApiResource'
                schemaFilters:
                  properties:
                    tables:
                      $ref: '#/components/schemas/SchemaEntityFilter'
                    schemas:
                      $ref: '#/components/schemas/SchemaEntityFilter'
                    databases:
                      $ref: '#/components/schemas/SchemaEntityFilter'
                  type: object
                sensitivity:
                  properties:
                    configured:
                      type: boolean
                      description: The stored sensitivity setting. Editable even when OAuth user-scoped results override it. Omit sensitivity to leave the setting unchanged.
                  required:
                  - configured
                  type: object
                allowWritebackCells:
                  type: boolean
                includeMagic:
                  type: boolean
                connectViaSsh:
                  type: boolean
                description:
                  type: string
                connectionDetails:
                  $ref: '#/components/schemas/EditConnectionDetails'
                name:
                  type: string
              type: object
      tags:
      - Data Connections
      summary: Edit data connection
      x-summary-source: derived
    get:
      operationId: GetDataConnection
      summary: GetDataConnection
      description: 'Get a single data connection by its ID.


        This endpoint is subject to the following rate limits:

        - `hex-api`: Default rate limit group for the Hex API

        - Max requests per minute may vary (default: 30)

        - Max requests per hour may vary (default: 1800)'
      parameters:
      - in: path
        name: dataConnectionId
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataConnection'
        '400':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.BAD_REQUEST'
        '401':
          description: Authorization not provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.UNAUTHORIZED'
        '403':
          description: Insufficient access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.FORBIDDEN'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.NOT_FOUND'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.INTERNAL_SERVER_ERROR'
      tags:
      - Data Connections
  /v1/data-connections/{dataConnectionId}/schema:
    patch:
      operationId: UpdateDataConnectionSchema
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateDataConnectionSchemaResponse'
        '400':
          description: ''
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Omit_TsoaErrorResponsePayload.details_'
                - properties:
                    details:
                      items:
                        $ref: '#/components/schemas/UpdateSchemaObjectErrorDetail'
                      type: array
                  type: object
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsoaErrorResponsePayload'
        '404':
          description: ''
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Omit_TsoaErrorResponsePayload.details_'
                - properties:
                    details:
                      items:
                        $ref: '#/components/schemas/UpdateSchemaObjectErrorDetail'
                      type: array
                  type: object
      description: 'Use this endpoint to add or remove a status (including endorsements) from databases, schemas, and tables

        within a data connection


        This endpoint uses atomic semantics - if any update in the batch fails validation,

        the entire request fails and no changes are applied'
      parameters:
      - in: path
        name: dataConnectionId
        required: true
        schema:
          $ref: '#/components/schemas/DataConnectionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDataConnectionSchemaRequest'
      tags:
      - Data Connections
      summary: Update data connection schema
      x-summary-source: derived
components:
  schemas:
    ScheduleCadenceApiEnum:
      $ref: '#/components/schemas/EnumValues_typeofScheduleCadenceApiEnum_'
      description: Types of cadence of a schedule for a Hex project.
    Pagination:
      type: object
      properties:
        before:
          type:
          - string
          - 'null'
          default: null
        after:
          type:
          - string
          - 'null'
          default: null
      required:
      - before
      - after
    SchemaObjectUpdate:
      description: 'Schema object update request - specifies a status change for a database, schema, or table.

        Currently, only status updates are supported.'
      properties:
        type:
          type: string
          enum:
          - DATABASE
          - SCHEMA
          - TABLE
          description: The type of object to update
        name:
          type: string
          description: The name of the object - simple for DATABASE, qualified for SCHEMA/TABLE
        status:
          type:
          - string
          - 'null'
          description: The status name to apply, or null to remove the current status
      required:
      - type
      - name
      - status
      type: object
      additionalProperties: false
    error.UNAUTHORIZED:
      type: object
      properties:
        message:
          type: string
          description: The error message
          example: Authorization not provided
        code:
          type: string
          description: The error code
          example: UNAUTHORIZED
        issues:
          type: array
          items:
            type: object
            properties:
              message:
                type: string
            required:
            - message
          description: An array of issues that were responsible for the error
          example: []
      required:
      - message
      - code
      title: Authorization not provided error (401)
      description: The error information
      example:
        code: UNAUTHORIZED
        message: Authorization not provided
        issues: []
    EnumValues_typeofDataConnectionSharingAccessLevelEnum_:
      type: string
      enum:
      - NONE
      - QUERY
      - VIEW_RESULTS
    Pick_TsoaErrorResponsePayload.Exclude_keyofTsoaErrorResponsePayload.details__:
      properties:
        reason:
          type: string
        traceId:
          $ref: '#/components/schemas/TraceId'
      required:
      - reason
      type: object
      description: From T, pick a set of properties whose keys are in the union K
    DataConnectionSharingAccessLevelEnum:
      $ref: '#/components/schemas/EnumValues_typeofDataConnectionSharingAccessLevelEnum_'
    UpdateDataConnectionSchemaResponse:
      description: Response body for successful schema object status updates
      properties:
        updated:
          properties:
            tables:
              items:
                properties:
                  status:
                    type:
                    - string
                    - 'null'
                  name:
                    type: string
                required:
                - status
                - name
                type: object
              type: array
            schemas:
              items:
                properties:
                  status:
                    type:
                    - string
                    - 'null'
                  name:
                    type: string
                required:
                - status
                - name
                type: object
              type: array
            databases:
              items:
                properties:
                  status:
                    type:
                    - string
                    - 'null'
                  name:
                    type: string
                required:
                - status
                - name
                type: object
              type: array
          required:
          - tables
          - schemas
          - databases
          type: object
      required:
      - updated
      type: object
      additionalProperties: false
    EnumValues_typeofScheduleCadenceApiEnum_:
      type: string
      enum:
      - HOURLY
      - DAILY
      - WEEKLY
      - MONTHLY
      - CUSTOM
    DataConnectionSchemaRefreshAccess:
      $ref: '#/components/schemas/EnumValues_typeofDataConnectionSchemaRefreshAccess_'
    EnumValues_typeofDataConnectionSchemaRefreshAccess_:
      type: string
      enum:
      - ADMINS
      - USERS_WITH_QUERY_ACCESS
    DataConnectionWithSensitiveFieldsApiResource:
      properties:
        id:
          $ref: '#/components/schemas/DataConnectionId'
        name:
          $ref: '#/components/schemas/Name'
        type:
          $ref: '#/components/schemas/DataConnectionApiType'
        description:
          type: string
        sensitivity:
          $ref: '#/components/schemas/DataConnectionSensitivityApiResource'
        connectionDetails:
          allOf:
          - $ref: '#/components/schemas/ReadableConnectionDetails'
        connectViaSsh:
          type: boolean
        includeMagic:
          type: boolean
        allowWritebackCells:
          type: boolean
        schemaFilters:
          properties:
            tables:
              $ref: '#/components/schemas/SchemaEntityFilter'
            schemas:
              $ref: '#/components/schemas/SchemaEntityFilter'
            databases:
              $ref: '#/components/schemas/SchemaEntityFilter'
          type: object
        schemaRefreshSchedule:
          $ref: '#/components/schemas/SchemaRefreshScheduleApiResource'
        schemaRefreshAccess:
          $ref: '#/components/schemas/DataConnectionSchemaRefreshAccess'
        sharing:
          properties:
            workspace:
              properties:
                public:
                  $ref: '#/components/schemas/DataConnectionSharingAccessLevelEnum'
                guests:
                  $ref: '#/components/schemas/DataConnectionSharingAccessLevelEnum'
                members:
                  $ref: '#/components/schemas/DataConnectionSharingAccessLevelEnum'
              type: object
            groups:
              items:
                properties:
                  access:
                    $ref: '#/components/schemas/DataConnectionSharingAccessLevelEnum'
                  group:
                    properties:
                      name:
                        type: string
                      id:
                        $ref: '#/components/schemas/GroupId'
                    required:
                    - name
                    - id
                    type: object
                required:
                - access
                - group
                type: object
              type: array
          type: object
      required:
      - id
      - name
      - type
      - sensitivity
      - connectionDetails
      - connectViaSsh
      - includeMagic
      - allowWritebackCells
      - schemaRefreshAccess
      - sharing
      type: object
      additionalProperties: false
    error.NOT_FOUND:
      type: object
      properties:
        message:
          type: string
          description: The error message
          example: Not found
        code:
          type: string
          description: The error code
          example: NOT_FOUND
        issues:
          type: array
          items:
            type: object
            properties:
              message:
                type: string
            required:
            - message
          description: An array of issues that were responsible for the error
          example: []
      required:
      - message
      - code
      title: Not found error (404)
      description: The error information
      example:
        code: NOT_FOUND
        message: Not found
        issues: []
    Omit_TsoaErrorResponsePayload.details_:
      $ref: '#/components/schemas/Pick_TsoaErrorResponsePayload.Exclude_keyofTsoaErrorResponsePayload.details__'
      description: Construct a type with the properties of T except for those in type K.
    DataConnectionId:
      type: string
      format: uuid
      description: Unique ID for a data connection.
      pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
    EnumValues_typeofDataConnectionPublicSharingAccessLevelEnum_:
      type: string
      enum:
      - NONE
      - VIEW_RESULTS
    EnumValues_typeofSchemaFilterMatchType_:
      type: string
      enum:
      - EXACT
      - PREFIX
      - REGEX
      - SUFFIX
    TsoaErrorResponsePayload:
      properties:
        details:
          type: string
        traceId:
          $ref: '#/components/schemas/TraceId'
        reason:
          type: string
      required:
      - reason
      type: object
    DataConnectionApiType:
      $ref: '#/components/schemas/EnumValues_typeofDataConnectionApiType_'
    EnumValues_typeofDayOfWeekApiEnum_:
      type: string
      enum:
      - SUNDAY
      - MONDAY
      - TUESDAY
      - WEDNESDAY
      - THURSDAY
      - FRIDAY
      - SATURDAY
    TraceId:
      type: string
      description: A unique identifier for this API request. The Hex Support team may request this value when debugging an issue.
    TimezoneStringDesignator:
      type: string
    UpdateDataConnectionSchemaRequest:
      description: 'Request body for updating data connection schema object statuses

        Currently, only status updates are supported.'
      properties:
        updates:
          items:
            $ref: '#/components/schemas/SchemaObjectUpdate'
          type: array
          description: Array of updates to apply
      required:
      - updates
      type: object
      additionalProperties: false
    EnumValues_typeofDataConnectionApiType_:
      type: string
      enum:
      - athena
      - bigquery
      - clickhouse
      - databricks
      - postgres
      - redshift
      - snowflake
      - trino
    DataConnectionBasic:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          enum:
          - athena
          - bigquery
          - clickhouse
          - databricks
          - postgres
          - redshift
          - snowflake
          - trino
        description:
          type: string
        sensitivity:
          type: object
          properties:
            configured:
              type: boolean
              description: Whether the data connection has been marked explicitly as sensitive.
            effective:
              type: boolean
              description: The computed effective sensitivity value of the data connection. This takes into account the OAuth user-scoped results setting.
              readOnly: true
            overrideReason:
              type:
              - string
              - 'null'
              enum:
              - USER_SCOPED_OAUTH_RESULTS
              description: The reason the effective value is different from the configured value. Null if they are the same.
              readOnly: true
          required:
          - configured
          - effective
          - overrideReason
      required:
      - id
      - name
      - type
      - sensitivity
    error.FORBIDDEN:
      type: object
      properties:
        message:
          type: string
          description: The error message
          example: Insufficient access
        code:
          type: string
          description: The error code
          example: FORBIDDEN
        issues:
          type: array
          items:
            type: object
            properties:
              message:
                type: string
            required:
            - message
          description: An array of issues that were responsible for the error
          example: []
      required:
      - message
      - code
      title: Insufficient access error (403)
      description: The error information
      example:
        code: FORBIDDEN
        message: Insufficient access
        issues: []
    TimezoneDesignator:
      type: string
      description: An ISO 8601 timezone designator like +08:00.
    Name:
      type: string
      minLength: 1
    GroupId:
      type: string
      format: uuid
      description: Unique ID for a group. This can be found from the groups page (in Settings).
      pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
    DataConnectionPublicSharingAccessLevelEnum:
      $ref: '#/components/schemas/EnumValues_typeofDataConnectionPublicSharingAccessLevelEnum_'
    DayOfWeekApiEnum:
      $ref: '#/components/schemas/EnumValues_typeofDayOfWeekApiEnum_'
    EditConnectionDetails:
      anyOf:
      - properties:
          athena:
            properties:
              secretAccessKey:
                type: string
              accessKeyId:
                type: string
              workgroup:
                type:
                - string
                - 'null'
              catalog:
                type:
                - string
                - 'null'
              s3OutputPath:
                type: string
              port:
                type: number
                format: double
              hostname:
                type: string
            type: object
        required:
        - athena
        type: object
      - properties:
          bigquery:
            properties:
              serviceAccountJsonConfig:
                type: string
              enableStorageApi:
                type: boolean
              enableDriveAccess:
                type: boolean
              projectId:
                type: string
            type: object
        required:
        - bigquery
        type: object
      - properties:
          databricks:
            properties:
              accessToken:
                type: string
              jdbcUrl:
                type: string
            type: object
        required:
        - databricks
        type: object
      - properties:
          postgres:
            properties:
              password:
                type: string
              username:
                type: string
              database:
                type: string
              port:
                type: number
                format: double
              hostname:
                type: string
            type: object
        required:
        - postgres
        type: object
      - properties:
          redshift:
            properties:
              sslRootCert:
                type:
                - string
                - 'null'
              password:
                type: string
              username:
                type: string
              database:
                type: string
              port:
                type: number
                format: double
              host:
                type: string
            type: object
        required:
        - redshift
        type: object
      - properties:
          snowflake:
            properties:
              role:
                type:
                - string
                - 'null'
              passphrase:
                type: string
              privateKey:
                type: string
              username:
                type: string
              schema:
                type:
                - string
                - 'null'
              database:
                type: string
              warehouse:
                type: string
              accountName:
                type: string
            type: object
        required:
        - snowflake
        type: object
      - properties:
          trino:
            properties:
              sessionProperties:
                items:
                  properties:
                    value:
                      type: string
                    key:
                      type: string
                  required:
                  - value
                  - key
                  type: object
                type:
                - array
                - 'null'
              password:
                type: string
              username:
                type: string
              schema:
                type: string
              catalog:
                type: string
              port:
                type: number
                format: double
              hostname:
                type: string
            type: object
        required:
        - trino
        type: object
    SchemaFilterMatchType:
