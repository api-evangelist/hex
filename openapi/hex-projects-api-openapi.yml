  /v1/projects/{projectId}/runs:
    get:
      operationId: GetProjectRuns
      summary: GetProjectRuns
      description: 'Get the status of runs of a project. By default, all run types are returned (API-triggered, scheduled, and publish/refresh runs). Use the `runTriggerFilter` parameter to filter to a specific type.


        This endpoint is subject to the following rate limits:

        - `hex-api`: Default rate limit group for the Hex API

        - Max requests per minute may vary (default: 30)

        - Max requests per hour may vary (default: 1800)'
      parameters:
      - in: path
        name: projectId
        description: The project whose runs should be listed.
        schema:
          type: string
          description: The project whose runs should be listed.
        required: true
      - in: query
        name: limit
        description: Number of runs to return per page.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
          description: Number of runs to return per page.
      - in: query
        name: offset
        description: Number of runs to skip.
        schema:
          type: integer
          minimum: 0
          default: 0
          description: Number of runs to skip.
      - in: query
        name: statusFilter
        schema:
          type: string
          enum:
          - PENDING
          - RUNNING
          - ERRORED
          - COMPLETED
          - KILLED
          - UNABLE_TO_ALLOCATE_KERNEL
      - in: query
        name: runTriggerFilter
        schema:
          type: string
          enum:
          - SCHEDULED
          - API
          - APP_REFRESH
          - ALL
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  runs:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProjectRun'
                  nextPage:
                    type:
                    - string
                    - 'null'
                  previousPage:
                    type:
                    - string
                    - 'null'
                  traceId:
                    type: string
                required:
                - runs
                - nextPage
                - previousPage
                - traceId
        '400':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.BAD_REQUEST'
        '403':
          description: Insufficient access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.FORBIDDEN'
        '422':
          description: Unprocessable content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.UNPROCESSABLE_CONTENT'
      tags:
      - Projects
    post:
      operationId: RunProject
      summary: RunProject
      description: 'Trigger a run of the latest published version of a project.


        This endpoint is subject to the following rate limits:

        - `hex-run-kernel`: Rate limits for starting project runs, sending thread messages, or executing kernels

        - Max requests per minute may vary

        - Max requests per hour may vary'
      parameters:
      - in: path
        name: projectId
        description: The project whose latest published version should run.
        schema:
          type: string
          description: The project whose latest published version should run.
        required: true
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunProjectRequestBody'
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  projectId:
                    type: string
                  runId:
                    type: string
                  runUrl:
                    type: string
                  runStatusUrl:
                    type: string
                  traceId:
                    type: string
                  projectVersion:
                    type: integer
                  notifications:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProjectRunNotificationRecipient'
                required:
                - projectId
                - runId
                - runUrl
                - runStatusUrl
                - traceId
                - projectVersion
        '400':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.BAD_REQUEST'
        '403':
          description: Insufficient access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.FORBIDDEN'
        '422':
          description: Unprocessable content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.UNPROCESSABLE_CONTENT'
        '503':
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.SERVICE_UNAVAILABLE'
      tags:
      - Projects
