openapi: 3.2.0
info:
  title: Hex Projects API
  version: 1.0.0
  description: API specification for the Hex External API
  license:
    name: UNLICENSED
  contact: {}
servers:
- url: https://app.hex.tech/api
security:
- bearerAuth: []
tags:
- name: Projects
paths:
  /v1/projects:
    get:
      operationId: ListProjects
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectsListApiResource'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsoaErrorResponsePayload'
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsoaErrorResponsePayload'
      description: List all viewable projects, sorted by most recently created first.
      parameters:
      - in: query
        name: includeArchived
        required: false
        schema:
          default: false
          type: boolean
      - in: query
        name: includeComponents
        required: false
        schema:
          default: false
          type: boolean
      - in: query
        name: includeTrashed
        required: false
        schema:
          default: false
          type: boolean
      - in: query
        name: includeUnlisted
        required: false
        schema:
          default: false
          type: boolean
      - in: query
        name: includeSharing
        required: false
        schema:
          default: false
          type: boolean
      - in: query
        name: statuses
        required: false
        schema:
          default: []
          type: array
          items:
            type: string
      - in: query
        name: categories
        required: false
        schema:
          default: []
          type: array
          items:
            type: string
      - in: query
        name: creatorEmail
        required: false
        schema:
          default: null
          type: string
      - in: query
        name: ownerEmail
        required: false
        schema:
          default: null
          type: string
      - in: query
        name: collectionId
        required: false
        schema:
          default: null
          type: string
      - in: query
        name: limit
        required: false
        schema:
          $ref: '#/components/schemas/PageSize'
      - in: query
        name: after
        required: false
        schema:
          default: null
      - in: query
        name: before
        required: false
        schema:
          default: null
      - in: query
        name: sortBy
        required: false
        schema:
          $ref: '#/components/schemas/SortByEnum'
      - in: query
        name: sortDirection
        required: false
        schema:
          $ref: '#/components/schemas/SortDirectionEnum'
      tags:
      - Projects
      summary: List projects
      x-summary-source: derived
    post:
      operationId: CreateProject
      summary: CreateProject
      description: 'Create a new project in the workspace with the specified title, and optionally a description.


        This endpoint is subject to the following rate limits:

        - `hex-api`: Default rate limit group for the Hex API

        - Max requests per minute may vary (default: 30)

        - Max requests per hour may vary (default: 1800)'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  description: The title of the new project.
                description:
                  type: string
                  description: An optional description for the new project.
              required:
              - title
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.BAD_REQUEST'
        '403':
          description: Insufficient access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.FORBIDDEN'
      tags:
      - Projects
  /v1/projects/{projectId}/queriedTables:
    get:
      operationId: GetQueriedTables
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectQueriedTablesApiResource'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsoaErrorResponsePayload'
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsoaErrorResponsePayload'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsoaErrorResponsePayload'
        '422':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsoaErrorResponsePayload'
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsoaErrorResponsePayload'
      description: Given a project ID, return the list of warehouse tables queried in the project.
      parameters:
      - in: query
        name: limit
        required: false
        schema:
          $ref: '#/components/schemas/PageSize'
      - in: query
        name: after
        required: false
        schema:
          default: null
      - in: query
        name: before
        required: false
        schema:
          default: null
      - in: path
        name: projectId
        required: true
        schema:
          $ref: '#/components/schemas/ProjectId'
      tags:
      - Projects
      summary: Get queried tables
      x-summary-source: derived
  /v1/projects/{projectId}/sharing/collections:
    patch:
      operationId: EditProjectSharingCollections
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditProjectSharingCollectionsResponse'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsoaErrorResponsePayload'
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsoaErrorResponsePayload'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsoaErrorResponsePayload'
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsoaErrorResponsePayload'
      description: 'Add a project to collections or remove it from collections.

        For projects, use `CAN_VIEW` to grant the UI permission labeled "Can explore".

        Use `APP_ONLY` to grant the UI permission labeled "Can view app".

        Workspace tokens calling this endpoint need to have "Collections -> Write access" scope

        in addition to "Projects -> Write access" scope.'
      parameters:
      - in: path
        name: projectId
        required: true
        schema:
          $ref: '#/components/schemas/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                sharing:
                  properties:
                    upsert:
                      properties:
                        collections:
                          items:
                            properties:
                              access:
                                $ref: '#/components/schemas/AccessLevelEnum'
                              collection:
                                properties:
                                  id:
                                    $ref: '#/components/schemas/CollectionId'
                                required:
                                - id
                                type: object
                            required:
                            - access
                            - collection
                            type: object
                          type: array
                          maxItems: 25
                      required:
                      - collections
                      type: object
                  required:
                  - upsert
                  type: object
              required:
              - sharing
              type: object
      tags:
      - Projects
      summary: Edit project sharing collections
      x-summary-source: derived
  /v1/projects/{projectId}/runs/{runId}:
    delete:
      operationId: CancelRun
      responses:
        '204':
          description: ''
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsoaErrorResponsePayload'
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsoaErrorResponsePayload'
        '422':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsoaErrorResponsePayload'
      description: Cancel a project run.
      parameters:
      - in: path
        name: projectId
        required: true
        schema:
          $ref: '#/components/schemas/ProjectId'
      - in: path
        name: runId
        required: true
        schema:
          $ref: '#/components/schemas/InputRunId'
      tags:
      - Projects
      summary: Cancel run
      x-summary-source: derived
    get:
      operationId: GetRunStatus
      summary: GetRunStatus
      description: 'Get the status of a project run.


        This endpoint is subject to the following rate limits:

        - `hex-api`: Default rate limit group for the Hex API

        - Max requests per minute may vary (default: 30)

        - Max requests per hour may vary (default: 1800)'
      parameters:
      - in: path
        name: projectId
        description: The project the run belongs to.
        schema:
          type: string
          description: The project the run belongs to.
        required: true
      - in: path
        name: runId
        description: The run to retrieve.
        schema:
          type: string
          description: The run to retrieve.
        required: true
      - in: header
        name: enable-expanded-stats
        description: Include state events and the run's flag configuration override. Set to `true` to enable.
        schema:
          type: string
          description: Include state events and the run's flag configuration override. Set to `true` to enable.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectRun'
        '400':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.BAD_REQUEST'
        '403':
          description: Insufficient access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.FORBIDDEN'
        '422':
          description: Unprocessable content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.UNPROCESSABLE_CONTENT'
      tags:
      - Projects
  /v1/projects/compute-profile/batch:
    post:
      operationId: BatchUpdateComputeProfile
      summary: BatchUpdateComputeProfile
      description: 'Update the compute profile (kernel image and/or kernel size) on one or more projects in a single request. At least one of kernelImage or kernelSize must be provided; the change applies to both the logic and published compute profiles. The caller must have edit permission on every project in the batch — a single failure rejects the whole batch (no partial updates). Cross-org project IDs are silently dropped. Batch size is capped at 250 IDs per request; larger batches should be paged.


        This endpoint is subject to the following rate limits:

        - `hex-api`: Default rate limit group for the Hex API

        - Max requests per minute may vary (default: 30)

        - Max requests per hour may vary (default: 1800)'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                projectIds:
                  type: array
                  items:
                    type: string
                  minItems: 1
                  maxItems: 250
                  description: Projects to update.
                kernelImage:
                  type: string
                  description: ID of the kernel image to set on each project (e.g. "python312").
                kernelSize:
                  type: string
                  enum:
                  - xsmall
                  - small
                  - medium
                  - large
                  - xlarge
                  - 2xlarge
                  - 4xlarge
                  - l4
                  - a10g
                  description: Kernel size preset to set on each project (e.g. "medium"). Must be a size the workspace is entitled to.
              required:
              - projectIds
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  projects:
                    type: array
                    items:
                      $ref: '#/components/schemas/BatchUpdateComputeProfileProject'
                    description: Post-update state for each project. Order is not guaranteed. Callers reconcile against the request by projectId; any requested project missing from this list was silently dropped (not found or in a different org).
                required:
                - projects
        '400':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.BAD_REQUEST'
        '401':
          description: Authorization not provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.UNAUTHORIZED'
        '403':
          description: Insufficient access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.FORBIDDEN'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.INTERNAL_SERVER_ERROR'
      tags:
      - Projects
  /v1/projects/{projectId}/sharing/groups:
    patch:
      operationId: EditProjectSharingGroups
      summary: EditProjectSharingGroups
      description: 'Add groups to a project or update/remove their project sharing access. Use CAN_VIEW for the UI permission labeled "Can explore" and APP_ONLY for "Can view app". Use NONE to remove a group''s access.


        This endpoint is subject to the following rate limits:

        - `hex-api`: Default rate limit group for the Hex API

        - Max requests per minute may vary (default: 30)

        - Max requests per hour may vary (default: 1800)'
      parameters:
      - in: path
        name: projectId
        description: The project to update sharing for.
        schema:
          type: string
          description: The project to update sharing for.
        required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sharing:
                  type: object
                  properties:
                    upsert:
                      type: object
                      properties:
                        groups:
                          type: array
                          items:
                            type: object
                            properties:
                              group:
                                type: object
                                properties:
                                  id:
                                    type: string
                                required:
                                - id
                              access:
                                type: string
                                enum:
                                - NONE
                                - APP_ONLY
                                - CAN_VIEW
                                - CAN_EDIT
                                - FULL_ACCESS
                            required:
                            - group
                            - access
                          maxItems: 25
                      required:
                      - groups
                  required:
                  - upsert
              required:
              - sharing
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  project:
                    $ref: '#/components/schemas/Project'
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        groupIds:
                          type: array
                          items:
                            type: string
                        reason:
                          type: string
                      required:
                      - groupIds
                      - reason
                required:
                - project
        '400':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.BAD_REQUEST'
        '401':
          description: Authorization not provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.UNAUTHORIZED'
        '403':
          description: Insufficient access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.FORBIDDEN'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.NOT_FOUND'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.INTERNAL_SERVER_ERROR'
      tags:
      - Projects
  /v1/projects/{projectId}/sharing/users:
    patch:
      operationId: EditProjectSharingUsers
      summary: EditProjectSharingUsers
      description: 'Add users to a project or update/remove their project sharing access. Use CAN_VIEW for the UI permission labeled "Can explore" and APP_ONLY for "Can view app". Use NONE to remove a user''s access.


        This endpoint is subject to the following rate limits:

        - `hex-api-30rpm`: Rate limit group for the Hex API at 30 requests per minute

        - Max 30 requests per minute'
      parameters:
      - in: path
        name: projectId
        description: The project to update sharing for.
        schema:
          type: string
          description: The project to update sharing for.
        required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sharing:
                  type: object
                  properties:
                    upsert:
                      type: object
                      properties:
                        users:
                          type: array
                          items:
                            type: object
                            properties:
                              user:
                                type: object
                                properties:
                                  id:
                                    type: string
                                required:
                                - id
                              access:
                                type: string
                                enum:
                                - NONE
                                - APP_ONLY
                                - CAN_VIEW
                                - CAN_EDIT
                                - FULL_ACCESS
                            required:
                            - user
                            - access
                          maxItems: 25
                      required:
                      - users
                  required:
                  - upsert
                includeUnlisted:
                  type: boolean
                  default: false
                  description: Set to true to update an unlisted project. When omitted or false, unlisted projects return 404.
              required:
              - sharing
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  project:
                    $ref: '#/components/schemas/Project'
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        userIds:
                          type: array
                          items:
                            type: string
                        reason:
                          type: string
                      required:
                      - userIds
                      - reason
                required:
                - project
        '400':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.BAD_REQUEST'
        '401':
          description: Authorization not provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.UNAUTHORIZED'
        '403':
          description: Insufficient access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.FORBIDDEN'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.NOT_FOUND'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.INTERNAL_SERVER_ERROR'
      tags:
      - Projects
  /v1/projects/{projectId}/sharing/workspaceAndPublic:
    patch:
      operationId: EditProjectSharingOrgAndPublic
      summary: EditProjectSharingOrgAndPublic
      description: 'Update workspace or public-web sharing for a project. For projects, use CAN_VIEW to grant the UI permission labeled "Can explore" and APP_ONLY for "Can view app". Use NONE to remove access. Omitted fields are left unchanged.


        This endpoint is subject to the following rate limits:

        - `hex-api`: Default rate limit group for the Hex API

        - Max requests per minute may vary (default: 30)

        - Max requests per hour may vary (default: 1800)'
      parameters:
      - in: path
        name: projectId
        description: The project to update sharing for.
        schema:
          type: string
          description: The project to update sharing for.
        required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sharing:
                  type: object
                  properties:
                    workspace:
                      type: string
                      enum:
                      - NONE
                      - APP_ONLY
                      - CAN_VIEW
                      - CAN_EDIT
                      - FULL_ACCESS
                      description: Omit to leave workspace sharing unchanged.
                    publicWeb:
                      type: string
                      enum:
                      - NONE
                      - APP_ONLY
                      - CAN_VIEW
                      - CAN_EDIT
                      - FULL_ACCESS
                      description: Omit to leave public-web sharing unchanged.
              required:
              - sharing
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  project:
                    $ref: '#/components/schemas/Project'
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                          enum:
                          - workspace
                          - publicWeb
                        reason:
                          type: string
                      required:
                      - type
                      - reason
                required:
                - project
        '400':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.BAD_REQUEST'
        '401':
          description: Authorization not provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.UNAUTHORIZED'
        '403':
          description: Insufficient access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.FORBIDDEN'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.NOT_FOUND'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.INTERNAL_SERVER_ERROR'
      tags:
      - Projects
  /v1/projects/export:
    post:
      operationId: ExportProject
      summary: ExportProject
      description: 'Exports a Hex project in the *.hex.yaml format.


        This endpoint is subject to the following rate limits:

        - `hex-api`: Default rate limit group for the Hex API

        - Max requests per minute may vary (default: 30)

        - Max requests per hour may vary (default: 1800)'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                projectId:
                  type: string
                  description: The project to export.
                version:
                  anyOf:
                  - type: integer
                    minimum: 1
                  - type: string
                    enum:
                    - draft
                  - type: string
                    enum:
                    - latest
                  default: draft
                  description: Used to specify the version to export. "draft" is the current notebook version; "latest" is the latest published app version.
              required:
              - projectId
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  filename:
                    type: string
                  content:
                    type: string
                    description: YAML encoded hex project following the *.hex.yaml format
                required:
                - filename
                - content
        '400':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.BAD_REQUEST'
        '401':
          description: Authorization not provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.UNAUTHORIZED'
        '403':
          description: Insufficient access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.FORBIDDEN'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.INTERNAL_SERVER_ERROR'
      tags:
      - Projects
  /v1/projects/{projectId}/runs/{runId}/cells/{staticId}/image:
    get:
      operationId: GetChartImageFromRun
      summary: GetChartImageFromRun
      description: 'Get the rendered PNG image of a chart cell from a completed run by staticCellId.

        The cell must have been executed and must not be in an error state.

        Only chart-type cells are supported.


        This endpoint is subject to the following rate limits:

        - `hex-chart-image`: Rate limits for rendering chart images

        - Max 20 requests per minute'
      parameters:
      - in: path
        name: projectId
        description: The project the run belongs to.
        schema:
          type: string
          description: The project the run belongs to.
        required: true
      - in: path
        name: runId
        description: The run to read the chart image from.
        schema:
          type: string
          description: The run to read the chart image from.
        required: true
      - in: path
        name: staticId
        description: The staticId of the chart cell (which remains stable across project versions), as opposed to its cellId (which is scoped to a specific version).
        schema:
          type: string
          description: The staticId of the chart cell (which remains stable across project versions), as opposed to its cellId (which is scoped to a specific version).
        required: true
      - in: query
        name: width
        description: Output image width in pixels, between 100 and 2000. Both width and height must be provided to apply.
        schema:
          type: integer
          minimum: 100
          maximum: 2000
          description: Output image width in pixels, between 100 and 2000. Both width and height must be provided to apply.
      - in: query
        name: height
        description: Output image height in pixels, between 100 and 2000. Both width and height must be provided to apply.
        schema:
          type: integer
          minimum: 100
          maximum: 2000
          description: Output image height in pixels, between 100 and 2000. Both width and height must be provided to apply.
      - in: query
        name: includeTitle
        description: Include the chart title in the image when true.
        schema:
          type: boolean
          description: Include the chart title in the image when true.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  projectId:
                    type: string
                  runId:
                    type: string
                  staticId:
                    type: string
                  imageBase64:
                    type: string
                    description: Base64-encoded PNG image of the chart cell as rendered at the time of the specified run.
                  mimeType:
                    type: string
                required:
                - projectId
                - runId
                - staticId
                - imageBase64
                - mimeType
        '400':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.BAD_REQUEST'
